version: "3.8"

services:

  # ===========================================
  # PostgreSQL Database (partagé Django)
  # ===========================================
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: "${DB_USER:-contraste}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME:-contraste}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contraste} -d ${DB_NAME:-contraste}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Django Backend (REST API + Admin)
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,api.contraste.tn}"
      DB_NAME: "${DB_NAME:-contraste}"
      DB_USER: "${DB_USER:-contraste}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://contraste.tn,https://www.contraste.tn}"
      ADMIN_URL: "${ADMIN_URL:-django-admin/}"
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/books/?limit=1')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Next.js Frontend App
  # ===========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DJANGO_URL: "${NEXT_PUBLIC_DJANGO_URL:-https://api.contraste.tn}"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DJANGO_URL: "${NEXT_PUBLIC_DJANGO_URL:-https://api.contraste.tn}"
      # Internal server-side URL (Docker network)
      DJANGO_INTERNAL_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
